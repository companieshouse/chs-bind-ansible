---
- name: Verify DNS records
  hosts: aws_ec2
  remote_user: ec2-user
  become: true
  gather_facts: false

  tasks:
    - name: Validate named configuration
      ansible.builtin.command:
        cmd: named-checkconf
      changed_when: false

    - name: Verify DNS record
      ansible.builtin.command:
        cmd: >-
          dig @localhost
          {{ bind_verification.record }}.{{ bind_verification.zone }}
          {{ bind_verification.type }}
          +short
      register: result
      changed_when: false
      retries: 10
      delay: 5
      until: bind_verification.expected_value in result.stdout

    - name: Validate DNS response
      ansible.builtin.assert:
        that:
          - bind_verification.expected_value in result.stdout
