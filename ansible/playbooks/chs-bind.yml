---
- name: Provision Ansible SSH key
  import_playbook: ansible-ssh-key.yml

- name: Setup chs-bind
  hosts: aws_ec2
  remote_user: ec2-user
  become: true
  gather_facts: true
  roles:
      - role: hostname
        tags: [hostname]

      - role: prerequisites
        tags: [prerequisites]

      - role: bind_install
        tags: [bind_install]

      - role: bind_configure
        tags: [bind_configure]

      - role: bind_zones
        tags: [bind_zones]

      - role: bind_service
        tags: [bind_service]

      - role: companieshouse.security.security_scans
