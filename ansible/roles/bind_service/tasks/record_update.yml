---
- name: Find matching zone definitions
  ansible.builtin.set_fact:
    bind_service_matching_zones: >-
      {{
        bind_service_zone_definitions.zones
        | selectattr('environment', 'equalto', bind_environment)
        | list
      }}

- name: Assert matching zone exists
  ansible.builtin.assert:
    that:
      - bind_service_matching_zones | length > 0
    fail_msg: >-
      No zone definition found for environment {{ bind_environment }}

- name: Set zone definition
  ansible.builtin.set_fact:
    bind_service_zone_definition: "{{ bind_service_matching_zones[0] }}"

- name: Apply DNS record updates to zone work file
  block:
    - name: Create work copy
      ansible.builtin.copy:
        remote_src: true
        src: "{{ bind_service_zone_dir }}/{{ bind_service_zone_definition.file }}"
        dest: "{{ bind_service_zone_dir }}/{{ bind_service_zone_definition.file }}.work"
        owner: root
        group: named
        mode: "0644"

    - name: Ensure zone ends with newline
      ansible.builtin.lineinfile:
        path: "{{ bind_service_zone_dir }}/{{ bind_service_zone_definition.file }}.work"
        line: ""
        insertafter: EOF

    - name: Ensure DNS record present
      ansible.builtin.lineinfile:
        path: "{{ bind_service_zone_dir }}/{{ bind_service_zone_definition.file }}.work"
        regexp: >-
          ^{{ dns_record.name | regex_escape }}[[:space:]]+IN[[:space:]]+
          {{ dns_record.type | regex_escape }}.*
        line: >-
          {{ dns_record.name }} IN {{ dns_record.type }}
          {{ dns_record.value }}
          ; owner={{ dns_record.owner | default('unknown') }}
          ticket={{ dns_record.ticket | default('n/a') }}
        insertafter: EOF
      register: bind_service_record_present
      when:
        - dns_record.action | default('add') in ['add', 'update']

    - name: Ensure DNS record absent
      ansible.builtin.lineinfile:
        path: "{{ bind_service_zone_dir }}/{{ bind_service_zone_definition.file }}.work"
        regexp: >-
          ^{{ dns_record.name | regex_escape }}[[:space:]]+IN[[:space:]]+
          {{ dns_record.type | regex_escape }}.*
        state: absent
      register: bind_service_record_absent
      when:
        - dns_record.action == 'remove'

    - name: Update serial for modified zone
      ansible.builtin.include_tasks: serial.yml
      when: >
        (bind_service_record_present is defined and
         bind_service_record_present.changed) or
        (bind_service_record_absent is defined and
         bind_service_record_absent.changed)

    - name: Validate updated zone
      ansible.builtin.command:
        cmd: >-
          named-checkzone
          {{ bind_service_zone_definition.zone }}
          {{ bind_service_zone_dir }}/{{ bind_service_zone_definition.file }}.work

    - name: Validate full DNS configuration
      ansible.builtin.command:
        cmd: named-checkconf -z
      changed_when: false

    - name: Compare current and validated zone
      ansible.builtin.command:
        cmd: >-
          cmp -s
          {{ bind_service_zone_dir }}/{{ bind_service_zone_definition.file }}
          {{ bind_service_zone_dir }}/{{ bind_service_zone_definition.file }}.work
      register: bind_service_zone_compare
      failed_when: false
      changed_when: false

    - name: Promote validated zone
      ansible.builtin.copy:
        remote_src: true
        src: "{{ bind_service_zone_dir }}/{{ bind_service_zone_definition.file }}.work"
        dest: "{{ bind_service_zone_dir }}/{{ bind_service_zone_definition.file }}"
        owner: root
        group: named
        mode: "0644"
      when: bind_service_zone_compare.rc != 0
      notify: Reload named

  rescue:

    - name: Remove failed work file
      ansible.builtin.file:
        path: "{{ bind_service_zone_dir }}/{{ bind_service_zone_definition.file }}.work"
        state: absent

    - name: Verify original zone still exists
      ansible.builtin.stat:
        path: "{{ bind_service_zone_dir }}/{{ bind_service_zone_definition.file }}"
      register: bind_service_live_zone

    - name: Assert live zone preserved
      ansible.builtin.assert:
        that:
          - bind_service_live_zone.stat.exists

    - name: Fail play
      ansible.builtin.fail:
        msg: "Zone validation failed. Original zone preserved."

  always:

    - name: Remove work file
      ansible.builtin.file:
        path: "{{ bind_service_zone_dir }}/{{ bind_service_zone_definition.file }}.work"
        state: absent
