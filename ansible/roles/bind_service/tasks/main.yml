---
- name: Acquire lock
  ansible.builtin.file:
    path: "{{ bind_service_lock_file }}"
    state: touch
    owner: "{{ bind_service_lock_owner }}"
    group: "{{ bind_service_lock_group }}"
    mode: "{{ bind_service_lock_mode }}"
  changed_when: false

- name: Read zones.yml from remote host
  ansible.builtin.slurp:
    src: "{{ bind_zones_git_checkout_dir }}/groups/zones/zones.yml"
  register: bind_service_bind_zones_yml

- name: Parse zones.yml
  ansible.builtin.set_fact:
    bind_service_zone_definitions: >-
      {{
        bind_service_bind_zones_yml.content
        | b64decode
        | from_yaml
      }}

- name: Manage service records
  ansible.builtin.include_tasks: records.yml
  when: bind_service_manage_records | bool

- name: Manage PTR records
  ansible.builtin.include_tasks: ptr.yml
  when:
    - bind_service_manage_ptr | bool
    - bind_service_auto_ptr | bool

- name: Validate zones
  ansible.builtin.include_tasks: validate.yml
  when: bind_service_validate_zones | bool

- name: Release lock
  ansible.builtin.file:
    path: "{{ bind_service_lock_file }}"
    state: absent
  changed_when: false
