---
- name: Validate all record zones exist in zones.yml
  ansible.builtin.assert:
    that:
      - >
        bind_service_zone_definitions.zones
        | selectattr('zone', 'equalto', item.zone)
        | list
        | length > 0
    fail_msg: "Zone {{ item.zone }} not found in zones.yml"
  loop: "{{ bind_service_records | unique(attribute='zone') }}"
  loop_control:
    label: "{{ item.zone }}"

- name: Process serial updates for affected zones
  ansible.builtin.include_tasks: serial_update.yml
  loop: "{{ bind_service_records | unique(attribute='zone') }}"
  loop_control:
    loop_var: zone_item
    label: "{{ zone_item.zone }}"
