---
dependency:
  name: galaxy

driver:
  name: docker

platforms:
  - name: ns1
    image: geerlingguy/docker-rockylinux9-ansible
    privileged: true
    pre_build_image: true
    command: /usr/sbin/init
    cgroupns_mode: host

    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - /Users/nosagie/.ssh:/root/.ssh:ro

  - name: ns2
    image: geerlingguy/docker-rockylinux9-ansible
    privileged: true
    pre_build_image: true
    command: /usr/sbin/init
    cgroupns_mode: host

    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - /Users/nosagie/.ssh:/root/.ssh:ro

provisioner:
  name: ansible

  env:
    ANSIBLE_ROLES_PATH: "/workspace/ansible/roles"

  inventory:
    host_vars: {}
    group_vars:
      all:
        bind_zones_git_repo: git@github.com:companieshouse/bind-terraform.git
        bind_zones_git_branch: main
    hosts:
      all:
        hosts:
          ns1:
          ns2:

verifier:
  name: ansible

